<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#16805f"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SKD CPNS"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Simulasi SKD CPNS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: lembar jawaban komputer (LJK) — soal di kiri, lembar bulatan di kanan; tinta "drop-out" hijau, isian pensil grafit */
:root{
  --paper:#f4f7f6; --card:#ffffff; --ink:#1b2422; --muted:#5d6966; --line:#d3dcd9;
  --drop:#16805f; --drop-soft:#e1f1ea; --graphite:#2a2e33; --on-graphite:#ffffff;
  --good:#2b7a3d; --good-soft:#e3f3e6; --bad:#b93a2e; --bad-soft:#fbe8e5; --warn:#a8660b; --warn-soft:#fbf0dc;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#111614; --card:#18201d; --ink:#e4ebe8; --muted:#97a5a0; --line:#2b3632;
  --drop:#4dc39e; --drop-soft:#16302a; --graphite:#dde3e6; --on-graphite:#111614;
  --good:#74c886; --good-soft:#18301f; --bad:#f08072; --bad-soft:#3a1d19; --warn:#e3a54a; --warn-soft:#33270f; color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 48px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--drop);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:9px 16px;font-weight:500}
.btn:hover{border-color:var(--drop)}
.btn.primary{background:var(--drop);border-color:var(--drop);color:var(--card)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--card)}

/* HOME */
.home{display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}
.masthead{display:grid;gap:10px;padding-block:12px 4px;border-bottom:2px solid var(--drop)}
.masthead h1{font-size:clamp(28px,4.4vw,42px);font-weight:700;letter-spacing:-.01em}
.masthead p{margin:0;color:var(--muted);max-width:64ch}
.formcode{font-family:var(--f-mono);font-size:12px;color:var(--drop);letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;display:grid;gap:14px;align-content:start;min-width:0}
.panel h2{font-size:19px}
.panel p{margin:0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fmt{width:100%;border-collapse:collapse;font-size:14px}
.fmt th,.fmt td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.fmt th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fmt td.n,.fmt th.n{font-family:var(--f-mono);text-align:right}
.hist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.hist li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-block:6px;font-size:14px}
.hist .sc{font-family:var(--f-mono);font-weight:600;color:var(--drop);white-space:nowrap}
.keys{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}

/* TEST */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:20px}
.bar .sec{display:grid;gap:2px}
.bar .sec strong{font-size:16px}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;padding:4px 12px;border:1.5px solid var(--ink);border-radius:6px}
.timer.low{color:var(--bad);border-color:var(--bad)}
.test{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:860px){.test{grid-template-columns:minmax(0,1fr)}}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px;display:grid;gap:18px;min-width:0}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.qnum{font-family:var(--f-mono);font-weight:600;font-size:14px;color:var(--drop)}
.direction{font-size:13px;color:var(--muted);border-left:3px solid var(--drop);padding-left:10px}
.stem{font-size:17.5px;line-height:1.6;white-space:pre-line}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-height:48px}
.opt>span:nth-child(2){flex:1}
.opt:hover:not(:disabled){border-color:var(--drop);background:var(--drop-soft)}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--drop);color:var(--drop);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600}
.opt.sel .bub{background:var(--graphite);border-color:var(--graphite);color:var(--on-graphite)}
.opt.sel{border-color:var(--graphite)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .bub{background:var(--good);border-color:var(--good);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt.mid{border-color:var(--warn);background:var(--warn-soft)}
.opt.mid .bub{background:var(--warn);border-color:var(--warn);color:var(--card)}
.opt:disabled{cursor:default}
.pt{flex:none;font-family:var(--f-mono);font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);background:var(--card)}
.pt.p5{color:var(--good);border-color:var(--good)}
.feedback{border-radius:8px;padding:14px 16px;display:grid;gap:8px;font-size:14px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback.mid{background:var(--warn-soft)}
.feedback.na{background:var(--paper);border:1px solid var(--line)}
.feedback strong{font-size:15px}
.why{display:grid;gap:2px}
.why p{margin:0}
.why.no .label{color:var(--bad)}
.why.ok .label{color:var(--good)}
.others summary{cursor:pointer;font-size:13px;color:var(--muted)}
.others ul{margin:6px 0 0;padding-left:18px;display:grid;gap:6px}
.tip{border:1px solid var(--drop);border-left-width:4px;border-radius:6px;padding:12px 14px;display:grid;gap:4px;font-size:14px}
.tip .label{color:var(--drop)}
.tip p{margin:0;max-width:72ch}
.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.flag{border:1px solid var(--line);background:transparent;border-radius:6px;padding:5px 10px;font-size:13px}
.flag.on{border-color:var(--warn);color:var(--warn)}

/* LJK SHEET */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);max-height:calc(100vh - 100px);overflow:auto}
.sheet-head{position:sticky;top:-16px;background:var(--card);padding-top:4px;z-index:1}
@media (max-width:860px){.sheet{position:static;max-height:none}.cells{grid-template-columns:repeat(10,1fr)}}
@media (max-width:520px){.cells{grid-template-columns:repeat(8,1fr)}}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--drop);padding-bottom:8px}
.sheet-head strong{color:var(--drop);font-size:14px;letter-spacing:.04em}
.grp{display:grid;gap:6px}
.cells{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.cell{position:relative;border:1.5px solid var(--drop);background:transparent;color:var(--drop);border-radius:50%;aspect-ratio:1;max-width:100%;font-family:var(--f-mono);font-size:11px;font-weight:600;display:grid;place-items:center;padding:0}
.cell.ans{background:var(--graphite);border-color:var(--graphite);color:var(--on-graphite)}
.cell.cur{outline:2px solid var(--drop);outline-offset:2px}
.cell.ok{background:var(--good);border-color:var(--good);color:var(--card)}
.cell.mid{background:var(--warn);border-color:var(--warn);color:var(--card)}
.cell.no{background:var(--bad);border-color:var(--bad);color:var(--card)}
.cell.flg::after{content:"";position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--drop)}
.legend i.a{background:var(--graphite);border-color:var(--graphite)}
.legend i.f{background:var(--warn);border-color:var(--warn)}
.legend i.g{background:var(--good);border-color:var(--good)}
.legend i.m{background:var(--warn);border-color:var(--warn)}
.legend i.r{background:var(--bad);border-color:var(--bad)}

/* RESULT */
.result{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
.score{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
@media (max-width:640px){.score{grid-template-columns:1fr}}
.big{font-family:var(--f-mono);font-size:clamp(52px,9vw,76px);font-weight:600;line-height:1;color:var(--drop);font-variant-numeric:tabular-nums}
.big small{font-size:.32em;color:var(--muted);font-weight:500}
.verdict{display:inline-block;margin-top:10px;font-weight:600;font-size:14px;padding:3px 10px;border-radius:999px}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
.bars{display:grid;gap:14px;min-width:0}
.barrow{display:grid;grid-template-columns:minmax(0,46px) 1fr auto;gap:12px;align-items:center;font-size:14px}
.barrow b{font-family:var(--f-mono)}
.track{position:relative;height:12px;background:var(--paper);border:1px solid var(--line);border-radius:999px}
.fill{height:100%;background:var(--drop);border-radius:999px}
.fill.no{background:var(--bad)}
.pg{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.note{font-size:13px;color:var(--muted);margin:0}
.review{display:grid;gap:8px}
.review details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.review summary{display:flex;gap:12px;align-items:center;cursor:pointer;list-style:none}
.review summary::-webkit-details-marker{display:none}
.review .mk{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--card)}
.review .mk.ok{background:var(--good)}.review .mk.no{background:var(--bad)}.review .mk.na{background:var(--muted)}.review .mk.mid{background:var(--warn)}
.review .sum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.review .body{display:grid;gap:8px;padding-top:12px;font-size:14px}
.tag{font-family:var(--f-mono);font-size:12px}
.ok-t{color:var(--good)}.no-t{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 16px;font-weight:500}
.chip:hover{border-color:var(--drop)}
.chip.on{background:var(--drop);border-color:var(--drop);color:var(--card)}
.chips.sm .chip{padding:4px 12px;font-size:13px}
.topics{display:grid;gap:6px}
.topic{border-bottom:1px solid var(--line);padding-block:6px}
.topic summary{display:flex;justify-content:space-between;gap:12px;cursor:pointer;font-weight:500}
.topic .cnt{color:var(--bad);font-size:13px;flex:none}
.topic p{margin:6px 0 4px;font-size:14px;color:var(--muted);max-width:72ch}
@media (pointer:coarse){.keys{display:none}}
@media (max-width:520px){.hidden-sm{display:none}.stem{font-size:16.5px}.qcard{padding:16px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ================= MATERI SINGKAT ================= */
const TIPS={
 'twk-pancasila':['Pancasila','Rumusan Pancasila tercantum di Pembukaan UUD 1945 alinea ke-4. Lambang sila: 1 bintang, 2 rantai, 3 pohon beringin, 4 kepala banteng, 5 padi dan kapas. Pancasila adalah sumber segala sumber hukum negara (UU 12/2011 Pasal 2).'],
 'twk-uud':['Pasal-pasal UUD 1945','Hafalkan pasal yang sering keluar: 1(1) negara kesatuan berbentuk republik, 1(2) kedaulatan rakyat, 1(3) negara hukum, 3(1) MPR mengubah UUD, 27(3) bela negara, 30(1) pertahanan dan keamanan, 33(3) kekayaan alam, 35–36B bendera, bahasa, lambang, lagu, 37(5) bentuk NKRI tidak dapat diubah.'],
 'twk-sejarah':['Sejarah kebangsaan','Urutan penting: Budi Utomo 20 Mei 1908, Sumpah Pemuda 28 Oktober 1928, sidang BPUPKI 29 Mei–1 Juni 1945, Piagam Jakarta 22 Juni 1945, Proklamasi 17 Agustus 1945 (Pegangsaan Timur 56), pengesahan UUD oleh PPKI 18 Agustus 1945, RIS 1949–1950, Dekrit Presiden 5 Juli 1959.'],
 'twk-hukum':['Tata urutan peraturan','UU 12/2011 Pasal 7: UUD 1945 → Tap MPR → UU/Perppu → PP → Perpres → Perda Provinsi → Perda Kabupaten/Kota. Hafalkan juga nama UU penting: 23/2019 bela negara, 24/2009 bendera-bahasa-lambang-lagu, 20/2023 ASN.'],
 'twk-integritas':['Integritas','Pilihan yang benar selalu jujur, sesuai aturan, dan tidak kompromi meski "sekali saja". Gratifikasi yang terkait jabatan ditolak, atau jika telanjur diterima dilaporkan ke KPK paling lambat 30 hari kerja. Pelanggaran dilaporkan lewat saluran resmi, bukan media sosial.'],
 'twk-belanegara':['Bela negara','Dasar hukum: Pasal 27(3) dan 30(1) UUD 1945, UU 23/2019. Lima nilai dasar bela negara: cinta tanah air, sadar berbangsa dan bernegara, setia pada Pancasila, rela berkorban, kemampuan awal bela negara.'],
 'twk-bahasa':['Bahasa negara','Kata depan "di", "ke", "dari" ditulis terpisah dari kata tempat; awalan "di-" disambung dengan kata kerja. Kalimat efektif tidak boleh pleonasme (para hadirin, naik ke atas) dan subjek tidak didahului kata depan. Gabungan kata: kerja sama, tanggung jawab (terpisah); antarkota, segitiga (serangkai).'],
 'twk-asn':['Nilai ASN','Core values ASN BerAKHLAK: Berorientasi Pelayanan, Akuntabel, Kompeten, Harmonis, Loyal, Adaptif, Kolaboratif.'],
 'tiu-sinonim':['Sinonim','Cari kata yang maknanya paling dekat dalam konteks umum. Kata serapan (niscaya, konklusi, ambigu) sering keluar, jadi perbanyak membaca KBBI.'],
 'tiu-antonim':['Antonim','Cari lawan makna yang paling tepat, bukan sekadar kata yang "berbeda". Hati-hati dengan pilihan yang justru sinonim.'],
 'tiu-analogi':['Analogi','Rumuskan hubungan pasangan pertama dalam satu kalimat ("X adalah alat yang dipakai Y"), lalu uji kalimat yang sama ke setiap pilihan. Urutannya harus sama.'],
 'tiu-silogisme':['Silogisme','Jika P maka Q; tidak Q → tidak P (modus tollens). "Semua A adalah B" + "sebagian C bukan B" → sebagian C bukan A. Jangan menyimpulkan hal yang tidak dinyatakan premis.'],
 'tiu-analitis':['Penalaran analitis','Gambar kotak posisi atau garis urutan. Isi dulu syarat yang pasti (ujung kiri, hari Rabu), lalu uji kemungkinan sisanya sampai hanya satu yang memenuhi semua syarat.'],
 'tiu-deret':['Deret angka dan huruf','Cek selisih antarsuku dulu. Jika selisihnya juga berpola (3,5,7 atau 1,2,4), lanjutkan pola selisihnya. Jika tidak, cek pola ×2+1 atau deret loncat (suku ganjil dan genap terpisah). Untuk huruf, ubah ke angka: A=1, B=2, …'],
 'tiu-hitung':['Hitungan cepat','Ubah semua ke bentuk yang sama (pecahan ↔ desimal ↔ persen). Ingat urutan operasi: akar/pangkat → kali/bagi → tambah/kurang.'],
 'tiu-perbandingan':['Perbandingan dan persen','Untuk perbandingan, cari nilai "satu bagian" dulu dari selisih atau jumlah. Persen untung = untung ÷ harga beli × 100%. Diskon bertingkat dihitung bertahap.'],
 'tiu-cerita':['Soal cerita','Waktu = jarak ÷ kecepatan. Pekerjaan: hitung "orang-hari" atau kecepatan kerja per hari. Umur: buat persamaan dengan variabel umur sekarang. Rata-rata: jumlah = rata-rata × banyak data.'],
 'tkp-pelayanan':['Pelayanan publik','Nilai 5 biasanya: ramah, empati, adil (tidak mendahulukan kerabat), dan tetap mencarikan solusi saat ada kendala. Menyalahkan orang lain atau menyuruh pergi bernilai rendah.'],
 'tkp-jejaring':['Jejaring kerja','Nilai tertinggi untuk sikap proaktif membangun hubungan, berkomunikasi, dan menjaga tujuan bersama. Menunggu, menghindar, atau bekerja sendiri bernilai rendah. Kerja sama tetap harus lewat prosedur resmi.'],
 'tkp-sosbud':['Sosial budaya','Pilih sikap menghargai perbedaan, beradaptasi, dan berbaur dengan masyarakat. Menjaga jarak atau hanya bergaul dengan kelompok sendiri bernilai rendah.'],
 'tkp-tik':['Teknologi informasi','Pilih sikap mau belajar teknologi baru dan memakainya untuk efisiensi, sambil menjaga keamanan data: tidak membagikan kata sandi, tidak mengklik tautan mencurigakan, melapor ke tim TI.'],
 'tkp-profesional':['Profesionalisme','Nilai 5: bertanggung jawab, jujur mengakui kesalahan, mengatur prioritas, terbuka terhadap kritik, dan berkomunikasi dengan atasan. Mengeluh, menolak tugas, atau menutupi kesalahan bernilai rendah.'],
 'tkp-radikal':['Anti radikalisme','Pilih tindakan yang tidak menyebarkan, mengingatkan dengan dialog, dan melapor lewat jalur resmi. Ikut menyebarkan atau ikut kegiatan bernilai 1. Sekadar menghindar bernilai rendah karena tidak menyelesaikan masalah.']
};

/* ================= BANK SOAL =================
   TWK & TIU: a = kunci (5 poin), w = alasan tiap pilihan salah ('' untuk kunci)
   TKP: sc = nilai tiap pilihan (1–5), w = alasan nilainya */
const PACKS=[
{name:'Paket 1',items:[
 /* ---------- TWK ---------- */
 {sec:'TWK',t:'twk-pancasila',keep:1,q:'Rumusan Pancasila sebagai dasar negara tercantum dalam Pembukaan UUD 1945 alinea ke-…',
  opts:['Pertama','Kedua','Ketiga','Keempat','Tidak tercantum dalam Pembukaan'],a:3,
  w:['Alinea pertama berisi pernyataan bahwa kemerdekaan adalah hak segala bangsa.','Alinea kedua berisi perjuangan pergerakan kemerdekaan yang telah sampai di depan pintu gerbang.','Alinea ketiga berisi pernyataan kemerdekaan "atas berkat rahmat Allah".','','Rumusan Pancasila justru ada di Pembukaan.'],
  ex:'Alinea keempat memuat tujuan negara dan dasar negara, yaitu rumusan lima sila Pancasila.'},
 {sec:'TWK',t:'twk-uud',q:'Lembaga negara yang berwenang mengubah dan menetapkan Undang-Undang Dasar adalah …',
  opts:['DPR','Presiden','MPR','Mahkamah Konstitusi','DPD'],a:2,
  w:['DPR membentuk undang-undang, bukan UUD.','Presiden tidak berwenang mengubah UUD.','','MK menguji undang-undang terhadap UUD, tidak mengubahnya.','DPD adalah bagian dari MPR, tapi tidak berwenang sendiri.'],

 {sec:'TWK',t:'twk-sejarah',q:'Semboyan "Bhinneka Tunggal Ika" berasal dari kitab …',

 K('radikal','Kegiatan wawasan kebangsaan di lingkungan Anda sepi peminat, terutama dari anak muda. Sikap Anda …',['Tidak peduli','Menyalahkan anak muda','Tetap hadir','Mengajak teman dan keluarga hadir','Mengusulkan kemasan yang lebih menarik (diskusi, lomba, konten kreatif) dan ikut mengajak anak muda terlibat'],['Tidak peduli.','Tidak solutif.','Cukup.','Mengajak.','Mengajak dan memperbaiki cara.'],'Nilai kebangsaan perlu disampaikan dengan cara yang dekat dengan anak muda.')
];

PACKS.push({name:'Paket 3',items:PK3},{name:'Paket 4',items:PK4},{name:'Paket 5',items:PK5});

/* ratakan ke satu bank soal, lalu acak urutan pilihan (tetap sama tiap dibuka) agar letak kunci tidak berpola */
const Q=[];
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ORDERED=/^Pasal|^(Pertama|Kedua|Ketiga|Keempat|Kelima)$|^[A-Z]$|^(Senin|Selasa|Rabu|Kamis|Jumat)$|^UU No/;
function permute(q){
  if(q.keep||(!isTKPraw(q)&&q.opts.every(o=>ORDERED.test(o))))return;
  const r=rng(q.id*7919),p=[0,1,2,3,4];
  for(let i=4;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]]}
  q.opts=p.map(i=>q.opts[i]);q.w=p.map(i=>q.w[i]);
  if(q.sc)q.sc=p.map(i=>q.sc[i]);else q.a=p.indexOf(q.a);
}
function isTKPraw(q){return q.sec==='TKP'}
PACKS.forEach((P,pi)=>P.items.forEach((q,k)=>{q.id=(pi+1)*1000+k;q.pack=pi;permute(q);Q.push(q)}));

const SEC={
 TWK:{name:'Tes Wawasan Kebangsaan',dir:'Pilih satu jawaban yang paling tepat. Benar 5 poin, salah atau kosong 0.',max:150,pg:65,real:30},
 TIU:{name:'Tes Intelegensia Umum',dir:'Pilih satu jawaban yang paling tepat. Benar 5 poin, salah atau kosong 0.',max:175,pg:80,real:35},
 TKP:{name:'Tes Karakteristik Pribadi',dir:'Tidak ada jawaban salah. Setiap pilihan bernilai 1 sampai 5. Pilih sikap yang paling tepat.',max:225,pg:166,real:45}
};
const ORDER=['TWK','TIU','TKP'];
const L5='ABCDE';
const byId=id=>Q.find(q=>q.id===id);
const isTKP=q=>q.sec==='TKP';
const bestOf=q=>isTKP(q)?q.sc.indexOf(5):q.a;
const ptsOf=(q,a)=>a===undefined?0:isTKP(q)?q.sc[a]:(a===q.a?5:0);
/* status: ok (benar / TKP 5), mid (TKP 4), no (salah / TKP ≤3), na (kosong) */
function status(q,a){if(a===undefined)return'na';if(!isTKP(q))return a===q.a?'ok':'no';const s=q.sc[a];return s===5?'ok':s===4?'mid':'no'}

/* ================= STORAGE ================= */
function sget(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const HKEY='cpns-skd-history-v1', WKEY='cpns-skd-wrong-v2', PKEY='cpns-skd-pack-v2', RKEY='cpns-skd-run-v1';
let selPack=sget(PKEY,0);
if(selPack!=='x'&&!(selPack>=0&&selPack<PACKS.length))selPack=0;

/* ================= PEMILIHAN SOAL ================= */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function randomSet(){
  const take=(s,n)=>shuffle(Q.filter(q=>q.sec===s)).slice(0,n).map(q=>q.id);
  return [...take('TWK',30),...take('TIU',35),...take('TKP',45)];
}
function packSet(pack,secs){
  if(pack==='x')return randomSet().filter(id=>secs.includes(byId(id).sec));
  return Q.filter(q=>q.pack===pack&&secs.includes(q.sec)).map(q=>q.id);
}
function packLabel(p){return p==='x'?'Acak':PACKS[p].name}
function limitFor(n){return Math.round(n*100/110)*60} // setara 100 menit untuk 110 soal

/* ================= STATE ================= */
let st=null, tick=null, confirmEnd=false, revFilter='wrong';
const app=document.getElementById('app');

function startTest(mode,ids,label){
  st={mode,ids,label,cur:0,ans:{},flags:{},start:Date.now(),limit:mode==='sim'?limitFor(ids.length):0,done:false};
  if(mode==='sim')saveRun();
  confirmEnd=false;clearInterval(tick);
  if(st.limit)tick=setInterval(()=>{updTimer();if(remaining()<=0)finish()},1000);
  renderTest();window.scrollTo(0,0);
}
/* simpan simulasi yang sedang berjalan agar bisa dilanjutkan */
function saveRun(){if(st&&st.mode==='sim'&&!st.done)sset(RKEY,{ids:st.ids,label:st.label,cur:st.cur,ans:st.ans,flags:st.flags,start:st.start,limit:st.limit})}
function getRun(){const r=sget(RKEY,null);return r&&Array.isArray(r.ids)&&r.ids.every(id=>byId(id))?r:null}
function resumeRun(){
  const r=getRun();if(!r)return;
  st={mode:'sim',ids:r.ids,label:r.label,cur:r.cur||0,ans:r.ans||{},flags:r.flags||{},start:r.start,limit:r.limit,done:false};
  confirmEnd=false;clearInterval(tick);
  if(remaining()<=0){finish();return}
  tick=setInterval(()=>{updTimer();if(remaining()<=0)finish()},1000);
  renderTest();window.scrollTo(0,0);
}
function remaining(){return st.limit-Math.floor((Date.now()-st.start)/1000)}
function fmtTime(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function updTimer(){const el=document.getElementById('timer');if(!el||!st)return;
  if(st.done){el.textContent=fmtTime(st.result.used);el.classList.remove('low');return}
  if(st.limit){const r=remaining();el.textContent=fmtTime(r);el.classList.toggle('low',r<=180)}
  else el.textContent=fmtTime(Math.floor((Date.now()-st.start)/1000));}

  document.getElementById('go-sim').onclick=()=>startTest('sim',packSet(selPack,ORDER),packLabel(selPack)+' · Simulasi');

    const v=b.dataset.prac, secs=v==='ALL'?ORDER:[v];

function orderIds(ids){return ids.slice().sort((a,b)=>{const A=byId(a),B=byId(b);return ORDER.indexOf(A.sec)-ORDER.indexOf(B.sec)||a-b})}

/* ================= TEST ================= */
function isLocked(id){return st.done||(st.mode==='prac'&&st.ans[id]!==undefined)}
function wrongNote(q,k){return(q.w&&q.w[k])||(q.sec==='TIU'?'Tidak cocok dengan pola atau hasil hitungan pada pembahasan.':'Pilihan ini tidak sesuai dengan yang ditanyakan.')}

function feedbackHTML(q,my){
  const s=status(q,my), tip=TIPS[q.t], b=bestOf(q);
  let h='';
  if(isTKP(q)){
    const head=my===undefined?'Tidak dijawab · 0 poin':`Nilai jawabanmu: ${q.sc[my]} dari 5`;
    h+=`<div class="feedback ${s}"><strong>${head} · Nilai tertinggi ${L5[b]}</strong>`;
    if(my!==undefined&&my!==b)h+=`<div class="why ${s==='no'?'no':''}"><span class="label">Kenapa ${L5[my]} bernilai ${q.sc[my]}</span><p>${wrongNote(q,my)}</p></div>`;
    h+=`<div class="why ok"><span class="label">Kenapa ${L5[b]} bernilai 5</span><p>${q.w[b]} ${q.ex}</p></div>`;
    const rank=[0,1,2,3,4].sort((x,y)=>q.sc[y]-q.sc[x]);
    h+=`<details class="others" ${my!==b?'open':''}><summary>Nilai semua pilihan</summary><ul>${rank.map(k=>`<li><b class="mono">${L5[k]} · ${q.sc[k]}</b> — ${wrongNote(q,k)}</li>`).join('')}</ul></details></div>`;
  }else{
    const ok=my===q.a;
    h+=`<div class="feedback ${s}"><strong>${my===undefined?'Tidak dijawab · 0 poin':ok?'Benar · 5 poin':'Kurang tepat · 0 poin'} · Kunci ${L5[q.a]}</strong>`;
    if(my!==undefined&&!ok)h+=`<div class="why no"><span class="label">Kenapa ${L5[my]} salah</span><p>${wrongNote(q,my)}</p></div>`;
    h+=`<div class="why ok"><span class="label">${ok?'Pembahasan':`Kenapa ${L5[q.a]} benar`}</span><p>${q.ex}</p></div>`;
    if(!ok){
      const others=[0,1,2,3,4].filter(k=>k!==q.a&&k!==my);
      h+=`<details class="others"><summary>Lihat alasan pilihan lainnya</summary><ul>${others.map(k=>`<li><b class="mono">${L5[k]}</b> ${q.opts[k]} — ${wrongNote(q,k)}</li>`).join('')}</ul></details>`;
    }
    h+=`</div>`;
  }
  if(tip)h+=`<div class="tip"><span class="label">Materi · ${tip[0]}</span><p>${tip[1]}</p></div>`;
  return h;
}

function renderTest(){
  const id=st.ids[st.cur], q=byId(id), n=st.cur+1, tot=st.ids.length;
  const locked=isLocked(id), my=st.ans[id], b=bestOf(q);
  let body=`<div class="stem">${q.q}</div>`;
  body+=`<div class="opts" role="radiogroup">${q.opts.map((o,k)=>{
    let c='opt';
    if(locked){
      if(k===b)c+=' right';
      else if(k===my)c+=isTKP(q)&&q.sc[k]===4?' mid':' wrong';
    }else if(k===my)c+=' sel';
    const pt=locked&&isTKP(q)?`<span class="pt ${q.sc[k]===5?'p5':''}">${q.sc[k]} poin</span>`:'';
    return `<button class="${c}" data-k="${k}" role="radio" aria-checked="${k===my}" ${locked?'disabled':''}><span class="bub">${L5[k]}</span><span>${o}</span>${pt}</button>`}).join('')}</div>`;
  if(locked)body+=feedbackHTML(q,my);

  app.innerHTML=`
  <div class="bar">
    <div class="sec"><span class="label">${st.label} · Soal ${n} dari ${tot}</span><strong>${SEC[q.sec].name}</strong></div>
    <div class="row">
      <span class="timer" id="timer" title="${st.limit?'Sisa waktu':'Waktu berjalan'}">00:00</span>
      <button class="btn ${confirmEnd?'danger':''}" id="end">${st.done?'Kembali ke hasil':confirmEnd?'Yakin selesai? Klik lagi':'Selesai'}</button>
      <button class="btn" id="home" title="Kembali ke beranda">Keluar</button>
    </div>
  </div>
  <div class="test">
    <section class="qcard">
      <div class="qhead"><span class="qnum">No. ${n} · ${q.sec} · ${PACKS[q.pack].name}</span>
        ${st.mode==='sim'&&!st.done?`<button class="flag ${st.flags[id]?'on':''}" id="flag">${st.flags[id]?'Ditandai ragu':'Tandai ragu'}</button>`:''}</div>
      <div class="direction">${SEC[q.sec].dir}</div>
      ${body}
      <div class="nav">
        <button class="btn" id="prev" ${st.cur===0?'disabled':''}>← Sebelumnya</button>
        ${st.cur<tot-1?`<button class="btn primary" id="next">Berikutnya →</button>`:`<button class="btn primary" id="end2">${st.done?'Kembali ke hasil':'Lihat hasil'}</button>`}
      </div>
    </section>
    ${renderSheet()}
  </div>`;
  updTimer();bindTest();
}

function renderSheet(){
  const groups=[];
  st.ids.forEach((id,pos)=>{const s=byId(id).sec;let G=groups.find(x=>x.g===s);if(!G){G={g:s,list:[]};groups.push(G)}G.list.push({id,pos})});
  const answered=st.ids.filter(id=>st.ans[id]!==undefined).length;
  const reveal=st.done||st.mode==='prac';
  return `<aside class="sheet" aria-label="Lembar jawaban">
    <div class="sheet-head"><strong>LEMBAR JAWABAN</strong><span class="mono" style="font-size:13px">${answered}/${st.ids.length}</span></div>
    ${groups.map(G=>`<div class="grp"><span class="label">${G.g} · ${SEC[G.g].name}</span><div class="cells">${G.list.map(({id,pos})=>{
      let c='cell';const a=st.ans[id],q=byId(id);
      if(isLocked(id)){const s=status(q,a);c+=s==='ok'?' ok':s==='mid'?' mid':s==='no'?' no':''}
      else if(a!==undefined)c+=' ans';
      if(pos===st.cur)c+=' cur';if(st.flags[id]&&!st.done)c+=' flg';
      return `<button class="${c}" data-go="${pos}" aria-label="Soal ${pos+1}">${a!==undefined&&!isLocked(id)?L5[a]:pos+1}</button>`}).join('')}</div></div>`).join('')}
    <div class="legend">${reveal?'<span><i></i>Kosong</span><span><i class="g"></i>Benar / 5</span><span><i class="m"></i>TKP 4</span><span><i class="r"></i>Salah / ≤3</span>':'<span><i></i>Kosong</span><span><i class="a"></i>Terisi</span><span><i class="f"></i>Ragu</span>'}</div>
  </aside>`;
}

function bindTest(){
  const id=st.ids[st.cur];
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.k));
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  const $=x=>document.getElementById(x);
  $('prev').onclick=()=>go(st.cur-1);
  if($('next'))$('next').onclick=()=>go(st.cur+1);
  if($('end2'))$('end2').onclick=endClick;
  $('end').onclick=endClick;
  $('home').onclick=renderHome;
  if($('flag'))$('flag').onclick=()=>{st.flags[id]=!st.flags[id];saveRun();renderTest()};
}
function endClick(){if(st.done){renderResult(st.result);return}if(!confirmEnd){confirmEnd=true;renderTest();setTimeout(()=>{if(confirmEnd&&st&&!st.done){confirmEnd=false;renderTest()}},4000);return}finish()}
function choose(k){const id=st.ids[st.cur];if(isLocked(id))return;st.ans[id]=k;confirmEnd=false;saveRun();renderTest()}
function go(p){if(p<0||p>=st.ids.length)return;confirmEnd=false;st.cur=p;saveRun();renderTest();window.scrollTo({top:0})}

/* ================= SKOR ================= */
function finish(){
  clearInterval(tick);
  if(st.done){renderResult(st.result);return}
  st.done=true;if(st.mode==='sim'){try{localStorage.removeItem(RKEY)}catch(e){}}
  const sec={};
  st.ids.forEach(id=>{const q=byId(id);const S=sec[q.sec]||(sec[q.sec]={raw:0,max:0,n:0,ok:0});S.raw+=ptsOf(q,st.ans[id]);S.max+=5;S.n++;if(status(q,st.ans[id])==='ok')S.ok++});
  for(const k in sec){const S=sec[k];S.scaled=Math.round(S.raw/S.max*SEC[k].max);S.pass=S.scaled>=SEC[k].pg}
  const full=ORDER.every(k=>sec[k]);
  const total=full?ORDER.reduce((t,k)=>t+sec[k].scaled,0):null;
  const allPass=ORDER.filter(k=>sec[k]).every(k=>sec[k].pass);
  const used=Math.floor((Date.now()-st.start)/1000);
  let wl=sget(WKEY,[]);
  st.ids.forEach(id=>{const s=status(byId(id),st.ans[id]);if(s==='ok'||s==='mid')wl=wl.filter(x=>x!==id);else if(s==='no'&&!wl.includes(id))wl.push(id)});
  sset(WKEY,wl);
  const h=sget(HKEY,[]);
  const secs=ORDER.filter(k=>sec[k]);
  const label=full?`${total} · ${allPass?'Lolos':'Belum lolos'}`:secs.map(k=>`${k} ${sec[k].scaled}`).join(' · ');
  h.unshift({date:new Date().toLocaleDateString('id-ID',{day:'numeric',month:'short'}),label:st.label,score:label});
  sset(HKEY,h.slice(0,8));
  st.result={sec,total,allPass,used,full};
  revFilter=st.ids.some(id=>status(byId(id),st.ans[id])!=='ok')?'wrong':'all';
  renderResult(st.result);
}

function renderResult(r){
  window.scrollTo(0,0);
  const secs=ORDER.filter(k=>r.sec[k]);
  const rows=secs.map(k=>{const S=r.sec[k],M=SEC[k];
    return `<div class="barrow"><b>${k}</b><div class="track"><div class="fill ${S.pass?'':'no'}" style="width:${S.scaled/M.max*100}%"></div><span class="pg" style="left:${M.pg/M.max*100}%" title="Ambang batas ${M.pg}"></span></div><span class="mono">${S.scaled}/${M.max} <span class="${S.pass?'ok-t':'no-t'}">${S.pass?'✓':'✗'} ${M.pg}</span></span></div>`}).join('');
  const failed=secs.filter(k=>!r.sec[k].pass);
  const notReview=st.ids.filter(id=>status(byId(id),st.ans[id])!=='ok');
  const tc={};st.ids.forEach(id=>{const q=byId(id),s=status(q,st.ans[id]);if(s==='no'||s==='na')tc[q.t]=(tc[q.t]||0)+1});
  const topics=Object.entries(tc).sort((a,b)=>b[1]-a[1]);
  const list=revFilter==='wrong'?notReview:st.ids;
  const big=r.full?`${r.total}<small>/550</small>`:secs.map(k=>r.sec[k].scaled).join(' · ');
  let msg;
  if(r.allPass)msg=r.full?'Semua subtes melewati ambang batas. Di seleksi asli, yang lolos ke SKB adalah peserta dengan peringkat teratas di formasinya, jadi terus kejar nilai setinggi mungkin.':'Subtes ini melewati ambang batas.';
  else msg=`Belum melewati ambang batas ${failed.length>1?failed.slice(0,-1).join(', ')+' dan '+failed[failed.length-1]:failed[0]}. Di seleksi asli, satu subtes saja yang kurang membuat peserta gugur meski totalnya tinggi.`;
  app.innerHTML=`
  <div class="result">
    <header class="masthead"><span class="formcode">HASIL · ${st.label.toUpperCase()} · WAKTU ${fmtTime(r.used)}</span><h1>Hasil ujian</h1></header>
    <section class="score">
      <div><span class="label">${r.full?'Perkiraan nilai SKD':'Perkiraan nilai'}</span><div class="big">${big}</div>
        <span class="verdict ${r.allPass?'ok':'no'}">${r.allPass?'Lolos ambang batas':'Belum lolos ambang batas'}</span></div>
      <div class="bars">${rows}
        <p class="note">${msg} Nilai di kanan sudah dikonversi ke skala ujian asli (garis hitam = ambang batas). Ini perkiraan dari ${st.ids.length} soal.</p></div>
    </section>
    <div class="row">
      ${notReview.length?`<button class="btn primary" id="redo">Latihan ulang ${notReview.length} soal belum maksimal</button>`:''}
      <button class="btn ${notReview.length?'':'primary'}" id="again">Ulangi${selPack==='x'?' (acak baru)':''}</button>
      <button class="btn" id="rev">Telusuri soal satu per satu</button>
      <button class="btn" id="home">Beranda</button>
    </div>
    ${topics.length?`<section class="panel"><span class="label">Materi yang perlu dipelajari</span>
      <div class="topics">${topics.map(([t,c])=>`<details class="topic"><summary><span>${TIPS[t][0]}</span><span class="mono cnt">${c} soal</span></summary><p>${TIPS[t][1]}</p></details>`).join('')}</div></section>`:''}
    <section class="review">
      <div class="row" style="justify-content:space-between"><span class="label">Pembahasan</span>
        <div class="chips sm"><button class="chip ${revFilter==='wrong'?'on':''}" data-f="wrong">Belum maksimal (${notReview.length})</button><button class="chip ${revFilter==='all'?'on':''}" data-f="all">Semua (${st.ids.length})</button></div></div>
      ${list.length?list.map(id=>{const pos=st.ids.indexOf(id),q=byId(id),my=st.ans[id],s=status(q,my),b=bestOf(q);
        return `<details ${s!=='ok'&&revFilter==='wrong'?'open':''}><summary><span class="mk ${s}">${pos+1}</span><span class="sum">${q.q.replace(/\n/g,' ')}</span><span class="tag hidden-sm">${q.sec} · ${ptsOf(q,my)} poin</span></summary>
          <div class="body">
            <div class="tag">Jawabanmu: <span class="${s==='ok'?'ok-t':'no-t'}">${my===undefined?'—':L5[my]+'. '+q.opts[my]}</span> · ${isTKP(q)?'Nilai 5':'Kunci'}: <span class="ok-t">${L5[b]}. ${q.opts[b]}</span></div>
            ${feedbackHTML(q,my)}
          </div></details>`}).join(''):'<p class="note">Semua jawaban sudah maksimal.</p>'}
    </section>
  </div>`;
  const $=x=>document.getElementById(x);
  const mode=st.mode, secsIn=[...new Set(st.ids.map(id=>byId(id).sec))];
  if($('redo'))$('redo').onclick=()=>startTest('prac',notReview,'Ulang soal');
  $('again').onclick=()=>startTest(mode,packSet(selPack,secsIn),packLabel(selPack)+(mode==='sim'?' · Simulasi':' · Latihan'));
  $('home').onclick=renderHome;
  $('rev').onclick=()=>{st.cur=0;renderTest()};
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{revFilter=b.dataset.f;renderResult(r)});
}

/* ================= KEYBOARD ================= */
document.addEventListener('keydown',e=>{
  if(!st||e.ctrlKey||e.metaKey||e.altKey)return;
  if(!document.querySelector('.qcard'))return;
  const k=e.key.toLowerCase();
  if(k.length===1&&'abcde'.includes(k)){choose('abcde'.indexOf(k));return}
  if(e.key==='ArrowRight'){go(st.cur+1);return}
  if(e.key==='ArrowLeft'){go(st.cur-1);return}
});

/* tombol Back di Android */
window.__back=function(){if(st){renderHome();window.scrollTo(0,0);return true}return false};

renderHome();
</script>
<script>if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(function(){})}</script>
